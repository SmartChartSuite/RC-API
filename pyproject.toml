[project]
name = "rc-api"
version = "1.0.3"
description = "SmartChart Suite Results Combining API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1,<2",
    "boto3>=1.43.122,<2",
    "fastapi>=0.162.0,<1",
    "httpx>=0.28.1,<1",
    "hypercorn>=0.18.0,<1",
    "langfuse>=5.0.4,<6",
    "litellm[mcp]==1.108.0",
    "loguru>=0.7.3,<1",
    "psycopg[binary,pool]>=3.3.6,<4",
    "pydantic>=2.14.2,<3",
    "pydantic-settings>=2.16.2,<3",
    "python-jose[cryptography]>=3.5.0,<4",
    "PyYAML>=6.0.3,<7",
    "SQLAlchemy>=2.1.6,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5",
    "pyright>=1.1.414,<2",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-env>=1.7.1,<2",
    "respx>=0.23.1",
    "ruff>=0.16.10,<1"
]

[tool.uv]
required-version = ">=0.13,<0.14"
package = false
exclude-newer = "7 days"
exclude-newer-package = { litellm = "2026-11-06T05:00:00Z" }

[tool.ruff]
line-length = 200

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pytest.ini_options.env]
HAPI_FHIR_CQL_EXECUTION_URL = "http://localhost:8080/fhir"
EXTERNAL_FHIR_SERVER_URL = "http://localhost:9090/fhir"
EXTERNAL_FHIR_SERVER_AUTH = ""
LOG_LEVEL = "WARNING"
DEPLOY_URL = "http://localhost/"
DB_SCHEMA = "rcapi"
AUTH_DISABLED = "true"
