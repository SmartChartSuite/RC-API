[project]
name = "rc-api"
version = "1.0.0"
description = "SmartChart Suite Results Combining API"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi==0.135.3",
    "httpx==0.28.1",
    "hypercorn==0.18.0",
    "langfuse==4.2.0",
    "litellm==1.84.0",
    "loguru==0.7.3",
    "psycopg[binary,pool]==3.3.3",
    "pydantic==2.12.5",
    "python-jose[cryptography]==3.5.0",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.0.49",
]

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.2.0",
    "pytest-env>=1.2.0",
    "ruff==0.15.10",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.ruff]
line-length = 200

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that require real external services (CQF Ruler, FHIR server). Run with: pytest -m integration",
]

[tool.pytest.ini_options.env]
CQF_RULER_R4 = "http://localhost:8080/fhir"
EXTERNAL_FHIR_SERVER_URL = "http://localhost:9090/fhir"
EXTERNAL_FHIR_SERVER_AUTH = ""
NLPAAS_URL = "False"
LOG_LEVEL = "WARNING"
API_DOCS = "false"
KNOWLEDGEBASE_REPO_URL = ""
DOCS_PREPEND_URL = ""
DEPLOY_URL = "http://localhost/"
DB_CONNECTION_STRING = "sqlite+pysqlite:///rcapi_test.sqlite"
DB_SCHEMA = "rcapi"
