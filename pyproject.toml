[project]
name = "rc-api"
version = "1.0.0"
description = "SmartChart Suite Results Combining API"
requires-python = ">=3.10,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "boto3>=1.43.46,<2",
    "fastapi>=0.139.0,<1",
    "httpx>=0.28.1,<1",
    "hypercorn>=0.18.0,<1",
    "langfuse>=4.14.0,<5",
    "litellm>=1.92.0,<2",
    "loguru>=0.7.3,<1",
    "psycopg[binary,pool]>=3.3.4,<4",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0,<4",
    "PyYAML>=6.0.3,<7",
    "SQLAlchemy>=2.0.49,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0,<5",
    "pyright>=1.1.407,<2",
    "pytest>=8.4.2,<9",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-env>=1.2.0,<2",
    "respx>=0.23.1",
    "ruff>=0.15.21,<1",
    "uv-bump>=0.5.0,<1",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.ruff]
line-length = 200

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pytest.ini_options.env]
HAPI_FHIR_CQL_EXECUTION_URL = "http://localhost:8080/fhir"
EXTERNAL_FHIR_SERVER_URL = "http://localhost:9090/fhir"
EXTERNAL_FHIR_SERVER_AUTH = ""
NLPAAS_URL = "False"
LOG_LEVEL = "WARNING"
KNOWLEDGEBASE_REPO_URL = ""
DOCS_PREPEND_URL = ""
DEPLOY_URL = "http://localhost/"
DB_CONNECTION_STRING = "sqlite+pysqlite:///rcapi_test.sqlite"
DB_SCHEMA = "rcapi"
